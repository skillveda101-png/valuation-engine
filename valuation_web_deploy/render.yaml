# Render Blueprint – deploy the backend with one click
# https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: valuation-engine
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VALUATION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
    plan: free
